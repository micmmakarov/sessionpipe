name: Receiver listing
description: List a receiver that speaks the protocol on sessionpipe.org/receivers
labels: [receiver]
body:
  - type: input
    id: name
    attributes: { label: Receiver name }
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Origin that serves /.well-known/sessionpipe
      description: CI runs the conformance suite against it at tier 0.
    validations: { required: true }
  - type: input
    id: maxtier
    attributes: { label: max_tier it declares }
